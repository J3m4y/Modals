<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <title> Attendance Management </title>
</head>

<body>
    <div class="row">
        <div class=" col-sm-6 p-5 text-center border border-success">
            <button type="button" class="btn btn-success"
             data-bs-toggle="modal" data-bs-target="#Jeremie">
             Create Account
            </button>  
    </div>
     
    
    <div class=" col-sm-6 p-5 text-center border border-success bg-black">
        
    </div>

    <!-- The Modal to Create Account -->
<div class="modal fade" id="Jeremie">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <i class="bi bi-person-fill-add"></i>
        <h4 class="modal-title"> Modal Heading </h4>
        

        <button type="button" class="btn-close" data-bs-dismiss="modal">
        </button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <form action=""method="">

          <div class="row">
          <div class="col">
            <input type="text" class="form-control border border-success" placeholder="Enter First Name">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Enter Last Name">
          </div>
        </div>

        <div class="row my-5">
          <div class="col">
            <input type="text" class="form-control border border-success" placeholder="Enter Address">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Enter Phone Number ">
          </div>

          <div class="row my-5">
          <div class="col">
            <input type="text" class="form-control border border-success" placeholder="Enter Email">
          </div>
          <div class="col">
            <input type="password" class="form-control" placeholder="Enter Password ">
          </div>

        </form>
       
      </div>

      

      </div>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-success">Close</button>
      </div>

    <div class="modal fade">
    </div>

    </div>
  </div>
</div>

</body>
</html>
